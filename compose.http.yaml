# Serve Dev over HTTP from the same image, so a Jev client can point its `baseUrl` at it:
#
#   docker compose -f compose.yaml -f compose.http.yaml up --build dev-serve
#   curl -s localhost:8000/health
#   curl -s localhost:8000/v1/systemone -H 'content-type: application/json' \
#     --data @examples/docker/request.json
#
# For NVIDIA, append -f compose.cuda.yaml before "up":
#
#   docker compose -f compose.yaml -f compose.http.yaml -f compose.cuda.yaml up --build dev-serve
#
# This file is additive. `dev` in compose.yaml still runs the one-shot SDK quickstart and
# still publishes no ports, so `docker compose run --rm dev` behaves exactly as before.
# Weights share the same named cache volume as that service.
#
# Set DEV_API_KEY (or DEV_API_KEY_FILE) to require `Authorization: Bearer <key>`.
# DEV_PRELOAD=1 builds every checkpoint at startup so the first request does not pay for
# it; the default here is 0 because it makes the container download the whole family on
# first boot, which is a surprise in a quickstart.
services:
  dev-serve:
    build:
      context: .
      args:
        TORCH_INDEX: "${DEV_TORCH_INDEX:-cpu}"
        TORCH_VERSION: "${DEV_TORCH_VERSION:-2.14.0}"
    # Overrides the image's one-shot quickstart CMD; the ENTRYPOINT that loads *_FILE
    # secrets still runs first.
    command: ["dev-serve"]
    ports:
      # Host address, host port, container port. The port comes from DEV_PORT, which
      # `dev-serve` itself reads, so the two sides cannot drift apart. The host side
      # stays on loopback unless DEV_BIND_ADDRESS says otherwise, because the API has
      # no authentication until DEV_API_KEY is set.
      - "${DEV_BIND_ADDRESS:-127.0.0.1}:${DEV_PORT:-8000}:${DEV_PORT:-8000}"
    environment:
      DEV_HOST: "${DEV_HOST:-0.0.0.0}"
      DEV_PORT: "${DEV_PORT:-8000}"
      DEV_DEVICE: "${DEV_DEVICE:-cpu}"
      DEV_PRELOAD: "${DEV_PRELOAD:-0}"
      DEV_MODELS: "${DEV_MODELS:-}"
      DEV_THREADS: "${DEV_THREADS:-${OMP_NUM_THREADS:-4}}"
      DEV_AUTO_TASK: "${DEV_AUTO_TASK:-0}"
      DEV_LOG_LEVEL: "${DEV_LOG_LEVEL:-info}"
      DEV_API_KEY: "${DEV_API_KEY:-}"
      DEV_API_KEY_FILE: "${DEV_API_KEY_FILE:-}"
      HF_HUB_OFFLINE: "${HF_HUB_OFFLINE:-0}"
      HF_TOKEN: "${HF_TOKEN:-}"
      HF_TOKEN_FILE: "${HF_TOKEN_FILE:-}"
      OMP_NUM_THREADS: "${OMP_NUM_THREADS:-4}"
    volumes:
      - model-cache:/home/dev/.cache/huggingface
      # Optional token files, readable by UID 10001. Never put a secret value in the
      # environment; these paths are read once at startup and the *_FILE variable is
      # then removed before the server execs.
      # - ${HF_TOKEN_PATH:?Set HF_TOKEN_PATH}:/run/secrets/hf_token:ro
      # - ${DEV_API_KEY_PATH:?Set DEV_API_KEY_PATH}:/run/secrets/dev_api_key:ro
    init: true
    restart: unless-stopped
    # The server preloads before it binds, so /health answers once the preloaded
    # checkpoints are ready. `up --wait` therefore waits for a usable server.
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:' + os.environ['DEV_PORT'] + '/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10m
      start_interval: 2s

volumes:
  model-cache:
    name: "${DEV_CACHE_VOLUME:-${COMPOSE_PROJECT_NAME}_model-cache}"
