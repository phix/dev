# Use with compose.yaml, and with compose.http.yaml when serving over HTTP. The
# `dev-serve` entry repeats the CUDA build args and device reservation because it is
# a separate service: overrides for `dev` never reach it, so it would serve on CPU.
services:
  dev:
    build:
      args:
        TORCH_INDEX: "${DEV_TORCH_INDEX:-cu128}"
    environment:
      DEV_DEVICE: "${DEV_DEVICE:-cuda}"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${DEV_GPU_ID:-0}"]
              capabilities: [gpu]

  dev-serve:
    build:
      context: .
      args:
        TORCH_INDEX: "${DEV_TORCH_INDEX:-cu128}"
    environment:
      DEV_DEVICE: "${DEV_DEVICE:-cuda}"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${DEV_GPU_ID:-0}"]
              capabilities: [gpu]
