services:
  dev:
    build:
      context: .
      args:
        TORCH_INDEX: "${DEV_TORCH_INDEX:-cpu}"
        TORCH_VERSION: "${DEV_TORCH_VERSION:-2.14.0}"
    environment:
      DEV_DEVICE: "${DEV_DEVICE:-cpu}"
      DEV_MODEL: "${DEV_MODEL:-auto}"
      DEV_MODEL_PATH: "${DEV_MODEL_PATH:-}"
      DEV_REQUEST_FILE: "${DEV_REQUEST_FILE:-/opt/dev/examples/request.json}"
      HF_HUB_OFFLINE: "${HF_HUB_OFFLINE:-0}"
      HF_TOKEN: "${HF_TOKEN:-}"
      HF_TOKEN_FILE: "${HF_TOKEN_FILE:-}"
      OMP_NUM_THREADS: "${OMP_NUM_THREADS:-4}"
    volumes:
      - model-cache:/home/dev/.cache/huggingface
    init: true

volumes:
  model-cache:
    name: "${DEV_CACHE_VOLUME:-${COMPOSE_PROJECT_NAME}_model-cache}"
